<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Forma</title>
    <script type="text/javascript">
      // Single-Page-App fallback for GitHub Pages (rafgraph/spa-github-pages).
      // GitHub Pages serves this file for unknown paths (deep links, hard refresh).
      // It rewrites the URL into a query string and redirects to the app root, where
      // the snippet in index.html restores the real path before the router boots.
      // pathSegmentsToKeep = 1 keeps the "/forma/" project-page base segment.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
